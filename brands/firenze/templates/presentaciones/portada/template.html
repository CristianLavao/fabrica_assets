<style>
  .pieza{--fondo:var(--castleton-green);--lado:var(--oxford-blue);width:1920px;height:1080px;overflow:hidden;display:flex;background:var(--fondo);color:var(--white);font-family:var(--font-body)}
  .fondo-oxford{--fondo:var(--oxford-blue);--lado:var(--castleton-green)}
  .izq{--a:var(--ajuste,1);flex:none;width:1100px;padding:96px;display:flex;flex-direction:column;overflow:hidden}
  .nombre{width:300px}.nombre svg{display:block;width:100%;height:auto}
  .grupo{margin-top:auto;display:flex;flex-direction:column;gap:calc(28px * var(--a))}
  .etiqueta{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--tea-green)}
  .fondo-oxford .etiqueta{color:var(--light-sea-green)}
  .regla{width:96px;height:6px;background:var(--light-sea-green)}
  .titulo{margin:0;font-family:var(--font-display);font-weight:500;font-size:calc(96px * var(--a));line-height:1.04;text-wrap:balance;max-width:900px}
  .titulo.largo{font-size:calc(80px * var(--a))}
  .sub{margin:0;font-size:calc(28px * var(--a));line-height:1.4;max-width:820px;color:var(--tea-green)}
  .meta{margin-top:calc(72px * var(--a));display:flex;gap:64px;padding-top:28px;border-top:2px solid color-mix(in srgb,var(--tea-green) 35%,transparent);font-size:20px}
  .meta:empty{display:none}
  .meta div{display:flex;flex-direction:column;gap:4px}
  .meta span{font-family:var(--font-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--tea-green)}
  .filo{flex:none;width:16px;background:var(--light-sea-green)}
  .der{position:relative;flex:1;background:var(--lado)}
  .der img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>

<div class="pieza fondo-{{fondo}}">
  <div class="izq" data-ajustar>
    <div class="nombre">{{{logo.nombre.blanco}}}</div>
    <div class="grupo">
      {{#etiqueta}}<div class="etiqueta">{{etiqueta}}</div>{{/etiqueta}}
      <div class="regla"></div>
      <h1 class="titulo{{#titulo_largo}} largo{{/titulo_largo}}">{{titulo}}</h1>
      {{#texto}}<p class="sub">{{texto}}</p>{{/texto}}
    </div>
    <div class="meta">{{#cliente}}<div><span>Preparado para</span>{{cliente}}</div>{{/cliente}}{{#fecha}}<div><span>Fecha</span>{{fecha}}</div>{{/fecha}}</div>
  </div>
  <div class="filo" aria-hidden="true"></div>
  <div class="der">
    {{#imagen}}<img class="trat-{{tratamiento}}" src="{{imagen}}" alt="">{{/imagen}}
  </div>
</div>
