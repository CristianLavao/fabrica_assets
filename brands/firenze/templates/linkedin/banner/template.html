<style>
  /* 1584×396. El logo de la página de LinkedIn tapa la zona inferior izquierda:
     ahí va solo la foto; el texto queda a la derecha y centrado en vertical. */
  .pieza{--fondo:var(--castleton-green);--acento:var(--tea-green);width:1584px;height:396px;overflow:hidden;display:flex;background:var(--fondo);color:var(--white);font-family:var(--font-body)}
  .fondo-oxford{--fondo:var(--oxford-blue);--acento:var(--light-sea-green)}
  .lado{position:relative;flex:none;width:560px;background:var(--oxford-blue);overflow:hidden}
  .lado img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .filo{flex:none;width:12px;background:var(--light-sea-green)}
  .bloque{--a:var(--ajuste,1);flex:1;padding:40px 96px 40px 72px;display:flex;flex-direction:column;justify-content:center;gap:calc(16px * var(--a));overflow:hidden}
  .regla{width:64px;height:5px;background:var(--light-sea-green)}
  .titulo{margin:0;font-family:var(--font-display);font-weight:500;font-size:calc(52px * var(--a));line-height:1.08;text-wrap:balance;max-width:820px}
  .titulo.largo{font-size:calc(44px * var(--a))}
  .apoyo{margin:0;font-size:calc(22px * var(--a));line-height:1.4;color:var(--acento)}
</style>

<div class="pieza fondo-{{fondo}}">
  <div class="lado">{{#imagen}}<img class="trat-{{tratamiento}}" src="{{imagen}}" alt="">{{/imagen}}</div>
  <div class="filo" aria-hidden="true"></div>
  <div class="bloque" data-ajustar>
    <div class="regla"></div>
    <h1 class="titulo{{#titulo_largo}} largo{{/titulo_largo}}">{{titulo}}</h1>
    {{#texto}}<p class="apoyo">{{texto}}</p>{{/texto}}
  </div>
</div>
